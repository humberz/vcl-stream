services:
  weather-overlay:
    image: nginx:alpine
    container_name: weather-overlay
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped

  brb-page:
    image: nginx:alpine
    container_name: brb-page
    ports:
      - "8081:80"
    volumes:
      - ./brb:/usr/share/nginx/html:ro
    restart: unless-stopped
