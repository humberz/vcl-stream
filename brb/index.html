<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Be Right Back</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 3840px;
      height: 2160px;
      overflow: hidden;
      background: #0a0e14;
      font-family: 'Figtree', sans-serif;
    }

    /* Subtle animated background */
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(246,134,31,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 50%, rgba(246,134,31,0.04) 0%, transparent 70%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }

    /* Scanline texture */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
    }

    .center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    /* Animated wave icon */
    .icon {
      width: 120px; height: 120px;
      border-radius: 32px;
      background: rgba(246,134,31,0.12);
      border: 2px solid rgba(246,134,31,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: iconPulse 3s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(246,134,31,0.3); }
      50%      { box-shadow: 0 0 0 20px rgba(246,134,31,0); }
    }

    .icon svg {
      width: 64px; height: 64px;
      fill: #F6861F;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 96px;
      color: #ffffff;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .title span {
      color: #F6861F;
    }

    .subtitle {
      font-size: 36px;
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    /* Animated dots */
    .dots {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }

    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #F6861F;
      opacity: 0.3;
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%,80%,100% { opacity: 0.3; transform: scale(1); }
      40%          { opacity: 1;   transform: scale(1.3); }
    }

    /* Bottom branding */
    .branding {
      position: absolute;
      bottom: 80px;
      left: 0; right: 0;
      text-align: center;
      font-size: 24px;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* Clock */
    .clock {
      position: absolute;
      top: 80px;
      right: 100px;
      font-size: 28px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      font-weight: 300;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <span class="clock" id="clock"></span>

  <div class="center">
    <div class="icon">
      <!-- Wave SVG icon -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 38 Q12 28 20 38 Q28 48 36 38 Q44 28 52 38 Q58 45 60 38" stroke="#F6861F" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M4 26 Q12 16 20 26 Q28 36 36 26 Q44 16 52 26 Q58 33 60 26" stroke="#F6861F" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>

    <div class="title">Be <span>Right</span> Back</div>
    <div class="subtitle">Live Cams will return shortly</div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>


  <script>
    function clock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    clock();
    setInterval(clock, 1000);
  </script>
</body>
</html>
